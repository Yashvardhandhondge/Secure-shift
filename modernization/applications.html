<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Inventory - EMDT - SecureShift</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="css/emdt.css">
</head>
<body data-root="../" data-product="emdt" data-page="apps" data-roles="admin,architect">

<main id="page" hidden>
  <div class="page-head">
    <div>
      <div class="crumbs"><a href="#" id="crumb-home">Home</a> / <span id="crumb-ent"></span> / Applications</div>
      <h1>Application Inventory</h1>
      <p id="page-sub">Applications registered for this enterprise</p>
    </div>
    <div class="page-actions">
      <div id="ent-picker"></div>
      <a class="btn" href="register-application.html" id="btn-register"><span data-i="plus"></span>Register Application</a>
    </div>
  </div>

  <div class="card row wrap" id="cat-strip" style="gap:24px"></div>

  <div class="grid g-4 mt" id="kpis"></div>

  <div class="card mt">
    <div class="filters">
      <div class="field grow"><label>Search</label>
        <div class="input-icon"><span data-i="search"></span><input class="input" id="f-search" placeholder="Search by application name or ID"></div></div>
      <div class="field"><label>Technology</label><select class="select" id="f-tech"><option value="">All</option><option>Java</option><option>PHP</option><option>.NET</option><option>COBOL</option></select></div>
      <div class="field"><label>Criticality</label><select class="select" id="f-crit"><option value="">All</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div>
      <div class="field"><label>Assessment</label><select class="select" id="f-assess"><option value="">All</option><option>Assessed</option><option>Not Assessed</option></select></div>
      <button class="btn btn-outline" id="btn-clear">Clear</button>
    </div>
    <div id="app-table"></div>
  </div>
</main>

<script src="../js/common/core.js"></script>
<script src="../js/common/ui.js"></script>
<script src="../js/data/users.js"></script>
<script src="../js/data/emdt-data.js"></script>
<script src="../js/data/emdt-calc.js"></script>
<script src="../js/common/shell.js"></script>
<script src="js/applications.js"></script>
</body>
</html>
